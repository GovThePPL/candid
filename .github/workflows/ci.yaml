# Candid CI/CD Pipeline
#
# Trigger: push to main, PRs to main
#
# Flow:
#   test-backend-unit ─┐
#                      ├─> build-images ──> deploy-staging ──> deploy-production
#   test-frontend ─────┘   (main only)     (auto, main)       (manual approval)
#
# The frontend-web image bakes EXPO_PUBLIC_* env vars at build time, so it
# must be built per-environment (staging URLs ≠ production URLs). It is built
# inside each deploy job, which has an `environment:` key granting access to
# environment-scoped variables.
#
# Registry: GitHub Container Registry (ghcr.io)
# For ECR/GCR, replace the registry login step and image URLs.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/candid

jobs:
  # ─── Test ────────────────────────────────────────────────────────────

  test-backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install -r backend/server/requirements.txt
        pip install pytest pytest-timeout requests

    - name: Run unit tests
      run: python -m pytest backend/tests/unit/ -v

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/app/package-lock.json

    - name: Install openapi-generator-cli
      run: npm install -g @openapitools/openapi-generator-cli

    - name: Generate API client
      run: bash frontend/regenerate_api.sh

    - name: Run tests
      run: npx jest --ci --forceExit
      working-directory: frontend/app

  # ─── Build ───────────────────────────────────────────────────────────

  build-images:
    name: Build ${{ matrix.image }}
    needs: [test-backend-unit, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
        - image: api
          dockerfile: backend/server/Dockerfile
          context: .
        - image: chat
          dockerfile: backend/chat-server/Dockerfile
          context: .
        - image: db
          dockerfile: backend/database/Dockerfile
          context: .
        - image: polis-db
          dockerfile: backend/polis-integration/database/Dockerfile
          context: .
        - image: nlp
          dockerfile: backend/nlp-service/Dockerfile
          context: ./backend/nlp-service
        - image: polis-server
          dockerfile: backend/polis-integration/polis/server/Dockerfile
          context: backend/polis-integration/polis/server
        - image: polis-math
          dockerfile: backend/polis-integration/polis/math/Dockerfile
          context: backend/polis-integration/polis/math
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true  # Required for Polis git submodule

    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest

    # For ECR alternative:
    #   - Replace docker/login-action with aws-actions/amazon-ecr-login
    #   - Set REGISTRY to your ECR URL (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com)

    # For GCR alternative:
    #   - Use google-github-actions/auth + docker/login-action with gcr.io
    #   - Set REGISTRY to gcr.io/your-project

  # ─── Deploy Staging ──────────────────────────────────────────────────

  deploy-staging:
    name: Deploy to Staging
    needs: [build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Build frontend image (env-specific build args)
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v5
      with:
        context: .
        file: frontend/Dockerfile.web
        push: true
        build-args: |
          EXPO_PUBLIC_API_URL=${{ vars.FRONTEND_API_URL }}
          EXPO_PUBLIC_CHAT_URL=${{ vars.FRONTEND_CHAT_URL }}
          EXPO_PUBLIC_KEYCLOAK_URL=${{ vars.FRONTEND_KEYCLOAK_URL }}
        tags: |
          ${{ env.IMAGE_PREFIX }}-frontend-web:${{ github.sha }}-staging
          ${{ env.IMAGE_PREFIX }}-frontend-web:staging

    - name: Configure kubectl
      uses: azure/setup-kubectl@v3

    - name: Set kubeconfig
      run: echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

    - name: Update images
      run: |
        TAG=${{ github.sha }}
        NS=candid-staging
        kubectl set image deployment/candid-api api=${{ env.IMAGE_PREFIX }}-api:${TAG} -n ${NS}
        kubectl set image deployment/candid-worker worker=${{ env.IMAGE_PREFIX }}-api:${TAG} -n ${NS}
        kubectl set image deployment/candid-chat chat=${{ env.IMAGE_PREFIX }}-chat:${TAG} -n ${NS}
        kubectl set image deployment/candid-frontend frontend=${{ env.IMAGE_PREFIX }}-frontend-web:${TAG}-staging -n ${NS}
        kubectl set image deployment/nlp nlp=${{ env.IMAGE_PREFIX }}-nlp:${TAG} -n ${NS}

    - name: Wait for rollout
      run: |
        NS=candid-staging
        kubectl rollout status deployment/candid-api -n ${NS} --timeout=120s
        kubectl rollout status deployment/candid-chat -n ${NS} --timeout=120s
        kubectl rollout status deployment/candid-frontend -n ${NS} --timeout=120s

    - name: Smoke tests
      run: |
        STAGING_URL="${{ vars.STAGING_URL }}"
        echo "Testing API health..."
        curl -sf "${STAGING_URL}/api/v1/ui/" > /dev/null
        echo "Testing chat health..."
        curl -sf "${STAGING_URL}:8002/health" > /dev/null || true
        echo "Staging smoke tests passed."

  # ─── Deploy Production ───────────────────────────────────────────────

  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: production  # Requires manual approval in GitHub Environment settings
    steps:
    - uses: actions/checkout@v4

    - name: Build frontend image (env-specific build args)
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v5
      with:
        context: .
        file: frontend/Dockerfile.web
        push: true
        build-args: |
          EXPO_PUBLIC_API_URL=${{ vars.FRONTEND_API_URL }}
          EXPO_PUBLIC_CHAT_URL=${{ vars.FRONTEND_CHAT_URL }}
          EXPO_PUBLIC_KEYCLOAK_URL=${{ vars.FRONTEND_KEYCLOAK_URL }}
        tags: |
          ${{ env.IMAGE_PREFIX }}-frontend-web:${{ github.sha }}
          ${{ env.IMAGE_PREFIX }}-frontend-web:latest

    - name: Configure kubectl
      uses: azure/setup-kubectl@v3

    - name: Set kubeconfig
      run: echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

    - name: Run migrations
      run: |
        TAG=${{ github.sha }}
        kubectl delete job candid-migrate -n candid --ignore-not-found
        kubectl apply -f - <<EOF
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: candid-migrate
          namespace: candid
        spec:
          parallelism: 1
          template:
            spec:
              restartPolicy: OnFailure
              containers:
              - name: migrate
                image: ${{ env.IMAGE_PREFIX }}-api:${TAG}
                command: ["bash", "/usr/src/app/backend/database/migrations/run_migrations.sh"]
                env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: candid-secrets
                      key: database-url
          backoffLimit: 3
        EOF
        kubectl wait --for=condition=complete job/candid-migrate -n candid --timeout=120s

    - name: Update images
      run: |
        TAG=${{ github.sha }}
        NS=candid
        kubectl set image deployment/candid-api api=${{ env.IMAGE_PREFIX }}-api:${TAG} -n ${NS}
        kubectl set image deployment/candid-worker worker=${{ env.IMAGE_PREFIX }}-api:${TAG} -n ${NS}
        kubectl set image deployment/candid-chat chat=${{ env.IMAGE_PREFIX }}-chat:${TAG} -n ${NS}
        kubectl set image deployment/candid-frontend frontend=${{ env.IMAGE_PREFIX }}-frontend-web:${TAG} -n ${NS}
        kubectl set image deployment/nlp nlp=${{ env.IMAGE_PREFIX }}-nlp:${TAG} -n ${NS}

    - name: Wait for rollout
      run: |
        NS=candid
        kubectl rollout status deployment/candid-api -n ${NS} --timeout=180s
        kubectl rollout status deployment/candid-chat -n ${NS} --timeout=180s
        kubectl rollout status deployment/candid-frontend -n ${NS} --timeout=180s

  # ─── Future additions ────────────────────────────────────────────────
  #
  # Integration tests:
  #   Add a test-backend-integration job that spins up Docker Compose
  #   and runs: python -m pytest backend/tests/ -v --ignore=backend/tests/unit
  #
  # File server build:
  #   Add a file-server matrix entry with AUTH_ISSUER, AUTH_CLIENT_ID,
  #   AUTH_AUDIENCE build args (values differ per environment).
  #   Like frontend-web, build per-environment in the deploy jobs.
  #
  # Notifications:
  #   Add Slack/email notifications on deploy-production success/failure.
