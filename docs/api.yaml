openapi: 3.0.3
info:
  title: Candid API
  description: API for Candid, a chat application for political discussion
  version: 0.1.0

servers:
  - url: http://127.0.0.1:8080/api/v1/
    description: Local API Server
  - url: wss://staging-ws.govtheppl.us/candid/v1
    description: Staging WebSocket server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CurrentUser:
      type: object
      required:
        - id
        - username
        - displayName
        - userType
        - status
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          description: Full size avatar (256x256) as base64 data URI
          nullable: true
        avatarIconUrl:
          type: string
          description: Icon size avatar (64x64) as base64 data URI
          nullable: true
        userType:
          type: string
          enum: [normal, guest]
        status:
          type: string
          enum: [active, inactive, deleted, banned]
        joinTime:
          type: string
          format: date-time
        trustScore:
          type: number
          format: decimal
        kudosCount:
          type: integer
          description: Number of kudos received by the user
        diagnosticsConsent:
          type: boolean
          nullable: true
          description: "Diagnostics consent: null = never asked, true = opted in, false = opted out"
        roles:
          type: array
          description: Scoped roles from user_role table (admin, moderator, facilitator, etc.)
          items:
            $ref: '#/components/schemas/UserRole'
    UserRole:
      type: object
      properties:
        role:
          type: string
          enum: [admin, moderator, facilitator, assistant_moderator, expert, liaison]
        locationId:
          type: string
          format: uuid
          nullable: true
        locationName:
          type: string
          nullable: true
        locationCode:
          type: string
          nullable: true
        sessionId:
          type: string
          format: uuid
          nullable: true
        sessionLabel:
          type: string
          nullable: true
    User:
      type: object
      required:
        - id
        - username
        - displayName
        - status
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          description: Full size avatar (256x256) as base64 data URI
          nullable: true
        avatarIconUrl:
          type: string
          description: Icon size avatar (64x64) as base64 data URI
          nullable: true
        status:
          type: string
          enum: [active, inactive, deleted, banned]
        trustScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Trust score of the user, between 0 and 1
        kudosCount:
          type: integer
          description: Number of kudos received by the user
        diagnosticsConsent:
          type: boolean
          nullable: true
          description: "Diagnostics consent: null = never asked, true = opted in, false = opted out"
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
          description: Scoped roles assigned to this user

    Location:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name of the location
        code:
          type: string
          nullable: true
          description: Short code for the location (e.g., "US", "OR")
        parentLocationId:
          type: string
          format: uuid
          nullable: true
          description: ID of the parent location (null for top-level)
        level:
          type: integer
          description: Hierarchy level (0 = top-level, higher = more specific)

    UserSettings:
      type: object
      properties:
        sessionWeights:
          type: array
          items:
            type: object
            required:
              - sessionId
              - weight
            properties:
              sessionId:
                type: string
                format: uuid
              weight:
                type: string
                enum: [most, more, default, less, least, none]
        chatRequestLikelihood:
          type: string
          enum: ["off", "rarely", "less", "normal", "more", "often"]
          description: How likely user is to receive chat requests (0=off, 1=rarely to 5=often)
        chattingListLikelihood:
          type: string
          enum: ["off", "rarely", "less", "normal", "more", "often"]
          description: How frequently items appear in user's chatting list (0=off, 1=rarely to 5=often)
        notificationsEnabled:
          type: boolean
          description: Whether push notifications are enabled
        notificationFrequency:
          type: string
          enum: ["off", "rarely", "less", "normal", "more", "often"]
          description: How many chat request notifications per day
        quietHoursStart:
          type: integer
          minimum: 0
          maximum: 23
          nullable: true
          description: Hour to start quiet period (no notifications). Null means quiet hours disabled.
        quietHoursEnd:
          type: integer
          minimum: 0
          maximum: 23
          nullable: true
          description: Hour to end quiet period. Null means quiet hours disabled.
        timezone:
          type: string
          description: User timezone (e.g. America/New_York)
        showRoleBadge:
          type: boolean
          description: Whether to display role badge on posts and comments
        notificationTypePrefs:
          type: object
          description: Per-type notification preferences. Absent keys default to enabled.
          additionalProperties:
            type: boolean
          example:
            comment_reply: true
            post_comment: true
            chat_request: true
            role_change: true
            moderation: true

    UserDemographics:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
          nullable: true
        lean:
          type: string
          nullable: true
          enum: [very_liberal, liberal, moderate, conservative, very_conservative]
        affiliation:
          type: string
          format: uuid
          nullable: true
          description: Reference to an affiliation entity
        education:
          type: string
          nullable: true
          enum: [less_than_high_school, high_school, some_college, associates, bachelors, masters, doctorate, professional]
        geoLocale:
          type: string
          nullable: true
          enum: [urban, suburban, rural]
        race:
          type: string
          nullable: true
        sex:
          type: string
          nullable: true
          enum: [male, female, other]
        ageRange:
          type: string
          nullable: true
          enum: ['18-24', '25-34', '35-44', '45-54', '55-64', '65+']
        incomeRange:
          type: string
          nullable: true
          enum: [under_25k, 25k-50k, 50k-75k, 75k-100k, 100k-150k, 150k-200k, over_200k]
        createdTime:
          type: string
          format: date-time
          nullable: true


    Position:
      type: object
      required:
        - id
        - creator
        - statement
        - sessionId
        - status
      properties:
        id:
          type: string
          format: uuid
        creator:
          $ref: '#/components/schemas/User'
        statement:
          type: string
        sessionId:
          type: string
          format: uuid
        session:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            label:
              type: string
        location:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
        createdTime:
          type: string
          format: date-time
        agreeCount:
          type: integer
        disagreeCount:
          type: integer
        passCount:
          type: integer
        chatCount:
          type: integer
        status:
          type: string
          enum: [active, inactive, removed]
        source:
          type: string
          enum: [default, chatting_list]
          description: Where this position came from in the card queue
        hasPendingRequests:
          type: boolean
          description: Whether user has pending chat requests on this position (only for chatting_list source)
        chattingListId:
          type: string
          format: uuid
          description: ID of the chatting list item (only for chatting_list source)
        availability:
          type: string
          enum: [online, notifiable, none]
          description: Whether users are available to chat about this position
        createdDuringStage:
          type: string
          nullable: true
          description: Session stage when this position was created

    UserPosition:
      type: object
      required:
        - id
        - userId
        - positionId
        - status
        - sessionId
        - locationId
        - statement
      properties:
        id:
          type: string
          format: uuid
        statement:
          type: string
        userId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        sessionName:
          type: string
          description: Name of the session
        locationName:
          type: string
          description: Name of the position location
        locationCode:
          type: string
          description: Short code of the position location
        status:
          type: string
          enum: [active, inactive, deleted, removed]
        agreeCount:
          type: integer
        disagreeCount:
          type: integer
        passCount:
          type: integer
        chatCount:
          type: integer

    Session:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        description:
          type: string
          nullable: true
        locationId:
          type: string
          format: uuid
        stage:
          type: string
          enum: [proposal_issue, proposal_qualify, proposal_stakeholders, opinion_discussion, opinion_curation, opinion_proposals, reflection, consensus]
        stageChangedAt:
          type: string
          format: date-time
          nullable: true
        stageChangedBy:
          type: string
          format: uuid
          nullable: true
        facilitatorUserId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, archived, cancelled]
        createdBy:
          type: string
          format: uuid
          nullable: true
        proposalMethod:
          type: string
          enum: [user_driven, admin_provided]
          description: How proposals are created for this session
        locationCode:
          type: string
          nullable: true
        locationName:
          type: string
          nullable: true

    AdminSession:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        description:
          type: string
          nullable: true
        locationId:
          type: string
          format: uuid
          nullable: true
        locationCode:
          type: string
          nullable: true
        locationName:
          type: string
          nullable: true
        stage:
          type: string
          enum: [proposal_issue, proposal_qualify, proposal_stakeholders, opinion_discussion, opinion_curation, opinion_proposals, reflection, consensus]
        stageChangedAt:
          type: string
          format: date-time
          nullable: true
        stageChangedBy:
          type: string
          format: uuid
          nullable: true
        facilitatorUserId:
          type: string
          format: uuid
          nullable: true
        facilitatorUsername:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived, cancelled]
        createdBy:
          type: string
          format: uuid
          nullable: true
        proposalMethod:
          type: string
          enum: [user_driven, admin_provided]

    Response:
      type: object
      required:
        - id
        - positionId
        - userId
        - response
      properties:
        id:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        response:
          type: string
          enum: [agree, disagree, pass, chat]

    ChatRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        initiator:
          $ref: '#/components/schemas/User'
          readOnly: true
        initiatorUserId:
          type: string
          format: uuid
          readOnly: true
          description: ID of the user who initiated the chat request
        userPositionId:
          type: string
          format: uuid
          description: Required when creating a chat request
        response:
          type: string
          enum: [pending, accepted, dismissed, timeout]
          description: Required when responding to a chat request (accepted or dismissed)
        responseTime:
          type: string
          format: date-time
          readOnly: true
        createdTime:
          type: string
          format: date-time
          readOnly: true
        updatedTime:
          type: string
          format: date-time
          readOnly: true
        chatLogId:
          type: string
          format: uuid
          readOnly: true
          description: The chat log ID, set when the request is accepted

    ChatLog:
      type: object
      required:
        - id
        - chatRequestId
        - startTime
      properties:
        id:
          type: string
          format: uuid
        chatRequestId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        endType:
          type: string
          enum: [user_exit, agreed_closure]

    ChatMessage:
      type: object
      required:
        - id
        - chatLogId
        - sender
        - type
        - content
        - sendTime
      properties:
        id:
          type: string
          format: uuid
        chatLogId:
          type: string
          format: uuid
        sender:
          $ref: '#/components/schemas/User'
        type:
          type: string
          enum: [text, agreed_position, agreed_closure]
        content:
          type: string
        targetId:
          type: string
          format: uuid
        sendTime:
          type: string
          format: date-time

    Survey:
      type: object
      required:
        - id
        - surveyTitle
        - createdTime
        - startTime
        - endTime
      properties:
        id:
          type: string
          format: uuid
        creator:
          $ref: '#/components/schemas/User'
        sessionId:
          type: string
          format: uuid
        surveyTitle:
          type: string
        surveyType:
          type: string
          enum: [standard, pairwise]
        locationId:
          type: string
          format: uuid
          nullable: true
        locationCode:
          type: string
          nullable: true
        locationName:
          type: string
          nullable: true
        sessionName:
          type: string
          nullable: true
        questionCount:
          type: integer
        status:
          type: string
          enum: [active, inactive, deleted]
        isActive:
          type: boolean
        daysRemaining:
          type: integer
          nullable: true
        dateRange:
          type: object
          nullable: true
          properties:
            start:
              type: string
            end:
              type: string
        createdTime:
          type: string
          format: date-time
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyQuestion'
        items:
          type: array
          nullable: true
          description: Pairwise survey items (only present when surveyType is pairwise)
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              text:
                type: string
              order:
                type: integer
        comparisonQuestion:
          type: string
          nullable: true
          description: Pairwise survey comparison question
        isGroupLabeling:
          type: boolean
          nullable: true
          description: Whether this is a group labeling survey

    UpdateSurveyRequest:
      type: object
      description: Request body for updating a survey. All fields are optional.
      properties:
        sessionId:
          type: string
          format: uuid
        surveyTitle:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time

    SurveyQuestion:
      type: object
      required:
        - id
        - surveyId
        - question
        - options
      properties:
        id:
          type: string
          format: uuid
        surveyId:
          type: string
          format: uuid
        question:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/SurveyQuestionOption'
        surveyTitle:
          type: string
          description: Title of the parent survey

    SurveyQuestionOption:
      type: object
      required:
        - id
        - surveyQuestionId
        - option
      properties:
        id:
          type: string
          format: uuid
        surveyQuestionId:
          type: string
          format: uuid
        option:
          type: string

    SurveyQuestionResponse:
      type: object
      required:
        - id
        - surveyQuestionOptionId
        - userId
        - responseTime
      properties:
        id:
          type: string
          format: uuid
        surveyQuestionOptionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        responseTime:
          type: string
          format: date-time

    Report:
      type: object
      required:
        - id
        - reportType
        - targetId
        - submitterId
        - ruleId
        - status
      properties:
        id:
          type: string
          format: uuid
        reportType:
          type: string
          enum: [position, chat_log, post, comment]
        targetId:
          type: string
          format: uuid
        submitterId:
          type: string
          format: uuid
        ruleId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, dismissed, action_taken, deleted, spurious]
        submitterComment:
          type: string

    ModAction:
      type: object
      required:
        - id
        - reportId
        - responder
        - modResponse
      properties:
        id:
          type: string
          format: uuid
        reportId:
          type: string
          format: uuid
        responder:
          $ref: '#/components/schemas/User'
        modResponse:
          type: string
          enum: [dismiss, take_action, mark_spurious]
        modResponseText:
          type: string

    ModActionAppeal:
      type: object
      required:
        - id
        - userId
        - modActionId
        - appealText
        - appealState
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        modActionId:
          type: string
          format: uuid
        appealText:
          type: string
        appealState:
          type: string
          enum: [pending, approved, denied, escalated, modified, overruled]

    ModerationHistoryEvent:
      type: object
      required:
        - id
        - actionType
        - actionDate
        - moderator
      properties:
        id:
          type: string
          format: uuid
        actionType:
          type: string
          enum: [warning, temporary_ban, permanent_ban, removed, dismiss]
        actionDate:
          type: string
          format: date-time
        durationDays:
          type: integer
          nullable: true
          description: Duration in days for temporary bans
        rule:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
        targetContent:
          type: string
          nullable: true
        reporter:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/User'
        reportReason:
          type: string
          nullable: true
        moderator:
          $ref: '#/components/schemas/User'
        moderatorComment:
          type: string
          nullable: true
        appealState:
          type: string
          nullable: true
          enum: [pending, approved, denied, escalated, modified, overruled]
        appealUser:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/User'
        appealText:
          type: string
          nullable: true
        appealResponses:
          type: array
          nullable: true
          items:
            type: object
            properties:
              responder:
                $ref: '#/components/schemas/User'
              responseText:
                type: string
              outcome:
                type: string
                nullable: true
                enum: [overruled, escalated, admin_decision]
                description: Role of this response in the appeal chain

    Kudos:
      type: object
      required:
        - id
        - chatLogId
      properties:
        id:
          type: string
          format: uuid
        sender:
          $ref: '#/components/schemas/User'
        senderUserId:
          type: string
          format: uuid
          description: ID of the user who sent the kudos
        receiverUserId:
          type: string
          format: uuid
          description: ID of the user who received the kudos
        chatLogId:
          type: string
          format: uuid
        createdTime:
          type: string
          format: date-time

    KudosCard:
      type: object
      required:
        - id
        - otherParticipant
        - closingStatement
        - chatEndTime
      properties:
        id:
          type: string
          format: uuid
          description: The chat_log_id (used for API calls)
        otherParticipant:
          $ref: '#/components/schemas/User'
        closingStatement:
          type: string
          description: The agreed closing statement from the chat
        chatEndTime:
          type: string
          format: date-time

    DemographicCard:
      type: object
      required:
        - field
        - question
        - options
      properties:
        field:
          type: string
          enum: [lean, education, geoLocale, sex]
        question:
          type: string
          description: Human-readable question
        options:
          type: array
          items:
            type: object
            required:
              - value
              - label
            properties:
              value:
                type: string
              label:
                type: string

    # Card queue wrapper schemas for discriminator support
    PositionCardItem:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum: [position]
        data:
          $ref: '#/components/schemas/Position'

    SurveyCardItem:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum: [survey]
        data:
          $ref: '#/components/schemas/SurveyQuestion'

    ChatRequestCardItem:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum: [chat_request]
        data:
          $ref: '#/components/schemas/ChatRequest'

    KudosCardItem:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum: [kudos]
        data:
          $ref: '#/components/schemas/KudosCard'

    DemographicCardItem:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum: [demographic]
        data:
          $ref: '#/components/schemas/DemographicCard'

    PairwiseCardItem:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum: [pairwise]
        data:
          $ref: '#/components/schemas/PairwiseComparison'

    BanNotificationCardItem:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum: [ban_notification]
        data:
          type: object
          properties:
            banType:
              type: string
              enum: [permanent_ban, temporary_ban]
            reason:
              type: string
              nullable: true
            ruleTitle:
              type: string
              nullable: true
            modActionId:
              type: string
              format: uuid
              nullable: true
            expiresAt:
              type: string
              format: date-time
              nullable: true
            hasAppealed:
              type: boolean
              nullable: true
            targetContent:
              type: object
              nullable: true
              description: The content (position or chat) that triggered the ban
              properties:
                type:
                  type: string
                  enum: [position, chat_log]
                statement:
                  type: string
                  nullable: true
                positionStatement:
                  type: string
                  nullable: true
                session:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                location:
                  type: object
                  nullable: true
                  properties:
                    code:
                      type: string
                    name:
                      type: string
                creator:
                  type: object
                  nullable: true
                participants:
                  type: array
                  nullable: true
                  items:
                    type: object
            actionChain:
              type: object
              nullable: true
              description: Privacy-filtered action chain for this ban
              properties:
                actionType:
                  type: string
                actionDate:
                  type: string
                  format: date-time
                  nullable: true
                durationDays:
                  type: integer
                  nullable: true
                ruleTitle:
                  type: string
                  nullable: true
                moderatorComment:
                  type: string
                  nullable: true
                appealState:
                  type: string
                  nullable: true
                  enum: [pending, approved, denied, escalated, modified, overruled]
                appealText:
