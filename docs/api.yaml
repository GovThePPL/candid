        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /users/{userId}/chats:
    get:
      operationId: getUserChats
      summary: Get a list of the user's historical chats
      tags:
        - Chat
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: positionId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter chats by position ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Maximum number of chats to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of chats to skip
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag from a previous response for conditional request
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
          description: Last-Modified date from a previous response for conditional request
      responses:
        '200':
          description: List of user's historical chats
          headers:
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Chat ID
                    startTime:
                      type: string
                      format: date-time
                    endTime:
                      type: string
                      format: date-time
                    endType:
                      type: string
                      description: How the chat ended
                      enum: [agreed_closure, user_exit, timeout, disagreement]
                    status:
                      type: string
                      description: Current status of the chat
                      enum: [active, archived, deleted]
                    position:
                      $ref: '#/components/schemas/Position'
                    otherUser:
                      $ref: '#/components/schemas/User'
                    agreedClosure:
                      $ref: '#/components/schemas/AgreedPositionProposal'
                      nullable: true
                      description: The agreed closure object if the chat ended with one
                    endedByUserId:
                      type: string
                      format: uuid
                      nullable: true
                      description: ID of the user who ended the chat
                    kudosSent:
                      type: boolean
                      description: Whether the current user sent kudos to the other user for this chat
                    kudosReceived:
                      type: boolean
                      description: Whether the other user sent kudos to the current user for this chat
        '304':
          description: Not Modified - cached version is still valid

  /users/{userId}/chats/metadata:
    get:
      operationId: getUserChatsMetadata
      summary: Get metadata about user's chat history for cache validation
      description: Returns lightweight metadata (count and last activity time) to check if full chat list needs to be refetched
      tags:
        - Chat
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chat list metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Total number of chats for this user
                  lastActivityTime:
                    type: string
                    format: date-time
                    nullable: true
                    description: Most recent chat activity (start or end time)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Forbidden - cannot view other user's chats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /sessions:
    get:
      operationId: getAllSessions
      summary: Get all sessions
      tags:
        - Sessions
      parameters:
        - name: locationId
          in: query
          description: Filter sessions assigned to this location
          schema:
            type: string
            format: uuid
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
