      responses:
        '201':
          description: Appeal created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModActionAppeal'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

