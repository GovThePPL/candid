      properties:
        id:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        position:
          $ref: '#/components/schemas/Position'
        isActive:
          type: boolean
        addedTime:
          type: string
          format: date-time
        lastChatTime:
          type: string
          format: date-time
          nullable: true
        chatCount:
          type: integer
        pendingRequestCount:
          type: integer
          description: Number of pending chat requests for this position

    Post:
      type: object
      required:
        - id
        - title
        - body
        - postType
        - status
        - creator
        - locationId
        - upvoteCount
        - downvoteCount
        - weightedUpvotes
        - weightedDownvotes
        - score
        - commentCount
        - createdTime
        - updatedTime
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        postType:
          type: string
          enum: [discussion, question, proposal]
        status:
          type: string
          enum: [active, deleted, removed, locked]
        creator:
          $ref: '#/components/schemas/User'
        locationId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
          nullable: true
        session:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            label:
              type: string
        location:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
        upvoteCount:
          type: integer
        downvoteCount:
          type: integer
        weightedUpvotes:
          type: number
          format: double
        weightedDownvotes:
          type: number
          format: double
        score:
          type: number
          format: double
        commentCount:
          type: integer
        creatorRole:
          type: string
          nullable: true
          description: Highest approved role at post location (null if no role or badge hidden)
        showCreatorRole:
          type: boolean
          nullable: true
          description: Whether creator role badge is shown on this post (only returned for own posts)
        pinnedCommentId:
          type: string
          format: uuid
          nullable: true
          description: ID of the pinned comment on this post (null if none)
        bridgingScore:
          type: number
          format: double
          nullable: true
          description: MF intercept measuring cross-ideology approval. Null until MF trains.
        isAnswered:
          type: boolean
          nullable: true
          description: Whether a Q&A post has been answered by an authority user (null for discussion posts)
        userVote:
          type: object
          nullable: true
          properties:
            voteType:
              type: string
              enum: [upvote, downvote]
            downvoteReason:
              type: string
              nullable: true
        createdTime:
          type: string
          format: date-time
        glossaryHighlight:
          type: boolean
          description: Whether glossary terms should be highlighted in this post
        updatedTime:
          type: string
          format: date-time
        createdDuringStage:
          type: string
          nullable: true
          description: Session stage when this post was created
        isPinned:
          type: boolean
          description: Whether this post is pinned in the current feed context
        pinnedStage:
          type: string
          nullable: true
          description: The stage this post is pinned at (null if not pinned)
        proposalStatus:
          type: string
          enum: [draft, finalized]
          nullable: true
          description: Proposal lifecycle status (null for non-proposals)
        proposalMetadata:
          type: object
          nullable: true
          description: Structured metadata from the proposal wizard

    PostList:
      type: object
      required:
        - posts
