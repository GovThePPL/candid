      tags:
        - Admin
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                parentLocationId:
                  type: string
                  format: uuid
                  description: Reparent the location (validates no circular refs)
      responses:
        '200':
          description: Location updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    delete:
      operationId: deleteLocation
      summary: Soft-delete a location, reparenting children to its parent
      description: >
        Marks the location as deleted (soft-delete). Any child locations are
        reparented to the deleted location's parent. The root location cannot
        be deleted. Existing content (positions, surveys) at the deleted
        location is preserved but the location no longer appears in the tree.
      tags:
        - Admin
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Location soft-deleted
        '400':
          description: Cannot delete (root location)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

