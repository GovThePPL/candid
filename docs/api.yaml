security:
  - BearerAuth: []

paths:
  /auth/token:
    post:
      operationId: getToken
      summary: Exchange credentials for tokens
      description: Proxies ROPC token request to Keycloak. Avoids CORS issues with direct browser-to-Keycloak calls.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /auth/register:
    post:
      operationId: registerUser
      summary: Register a new user account
      description: Creates a new user in Keycloak. After registration, use POST /auth/token to obtain tokens.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error (missing fields, short password, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /admin/surveys/{surveyId}:
    get:
      operationId: getSurveyByIdAdmin
      summary: Get a specific survey (admin access)
      tags:
        - Admin
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Survey details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Survey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    patch:
      operationId: updateSurvey
      summary: Update a survey
      tags:
        - Admin
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSurveyRequest'
      responses:
        '200':
          description: Survey updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Survey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    delete:
      operationId: deleteSurvey
      summary: Delete a survey
      tags:
        - Admin
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Survey deleted successfully
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Survey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /card-queue:
    get:
      operationId: getCardQueue
      summary: Get mixed queue of positions, surveys, chat requests, kudos, and demographics
      tags:
        - Cards
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
          description: Maximum number of cards to return
        - name: sessionId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter session-scoped cards (positions, surveys, pairwise) to this session. Non-session cards (chat requests, kudos, demographics) pass through unfiltered.
        - name: phase
          in: query
          schema:
            type: string
            enum: [proposal, opinion, reflection, consensus]
          description: Filter position cards by the major phase they were created during
        - name: browseAll
          in: query
          schema:
            type: boolean
            default: false
          description: When true, returns all cards (including previously voted/answered) for archived stage browsing
      responses:
        '200':
          description: Mixed queue of cards. Priority cards (chat_request, kudos) appear at front, followed by shuffled pool (demographic, survey, position).
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/PositionCardItem'
                    - $ref: '#/components/schemas/SurveyCardItem'
                    - $ref: '#/components/schemas/ChatRequestCardItem'
                    - $ref: '#/components/schemas/KudosCardItem'
                    - $ref: '#/components/schemas/DemographicCardItem'
                    - $ref: '#/components/schemas/PairwiseCardItem'
                    - $ref: '#/components/schemas/BanNotificationCardItem'
                    - $ref: '#/components/schemas/PositionRemovedCardItem'
                    - $ref: '#/components/schemas/DiagnosticsConsentCardItem'
                    - $ref: '#/components/schemas/BridgingKudosCardItem'
                  discriminator:
                    propertyName: type
                    mapping:
                      position: '#/components/schemas/PositionCardItem'
                      survey: '#/components/schemas/SurveyCardItem'
                      chat_request: '#/components/schemas/ChatRequestCardItem'
                      kudos: '#/components/schemas/KudosCardItem'
                      demographic: '#/components/schemas/DemographicCardItem'
                      pairwise: '#/components/schemas/PairwiseCardItem'
                      ban_notification: '#/components/schemas/BanNotificationCardItem'
                      position_removed_notification: '#/components/schemas/PositionRemovedCardItem'
                      diagnostics_consent: '#/components/schemas/DiagnosticsConsentCardItem'
                      bridging_kudos: '#/components/schemas/BridgingKudosCardItem'

  /cards/notifications/{positionId}:
    delete:
      operationId: deletePositionNotification
      summary: Dismiss a position removed notification
      tags:
        - Cards
      parameters:
        - name: positionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Notification dismissed

  /card-queue/bridging-kudos/{awardId}:
    delete:
      operationId: dismissBridgingKudos
      summary: Dismiss a bridging kudos card
      tags:
        - Cards
      parameters:
        - name: awardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Bridging kudos card dismissed

  /moderation/notifications/{appealId}:
    delete:
      operationId: deleteAdminResponseNotification
      summary: Dismiss an admin response notification
      tags:
        - Moderation
      parameters:
        - name: appealId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Notification dismissed

  /positions:
    post:
      operationId: createPosition
      summary: Create a new position statement
      tags:
        - Positions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - statement
                - sessionId
                - locationId
              properties:
                statement:
                  type: string
                  maxLength: 140
                  description: The position statement (max 140 characters for Polis compatibility)
                sessionId:
                  type: string
                  format: uuid
                locationId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Position created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /positions/{positionId}:
    get:
      operationId: getPositionById
      summary: Get a specific position statement
      tags:
        - Positions
      parameters:
        - name: positionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Position statement details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '404':
          description: Position not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'


  /positions/{positionId}/agreed-closures:
    get:
      operationId: getPositionAgreedClosures
      summary: Get all agreed closures for chats about a position
      description: |
        Returns all chats that ended with an agreed closure for the specified position.
        Results are sorted by priority: mutual kudos + cross-group first, then cross-group only,
        then mutual kudos only, then by date.
      tags:
        - Positions
      parameters:
        - name: positionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of agreed closures with position and group info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedClosuresResponse'
        '404':
          description: Position not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /positions/responses:
    post:
      operationId: createPositionResponses
      summary: Respond to one or more position statements
      tags:
        - Positions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionResponse'
      responses:
        '200':
          description: Responses recorded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Response'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /positions/search:
    post:
      operationId: searchSimilarPositions
      summary: Search for positions with similar meaning
      description: Uses semantic similarity to find existing positions that match the given statement
      tags:
        - Positions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - statement
              properties:
                statement:
                  type: string
                  description: The statement to find similar positions for
                  minLength: 20
                sessionId:
                  type: string
                  format: uuid
                  description: Optional session filter
                locationId:
                  type: string
                  format: uuid
                  description: Optional location filter
                limit:
                  type: integer
                  default: 5
                  minimum: 1
                  maximum: 10
                  description: Maximum number of similar positions to return
      responses:
        '200':
          description: Similar positions found
          content:
            application/json:
              schema:
                type: array
                items:
