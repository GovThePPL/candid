        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '409':
          description: Report already claimed by another moderator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /moderation/queue:
    get:
      operationId: getModerationQueue
      summary: Get unified moderation queue with all items requiring moderator attention
      tags:
        - Moderation
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of all moderation items requiring attention
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - type
                    - data
                  properties:
                    type:
                      type: string
                      enum: [report, appeal, admin_response_notification]
                    data:
                      oneOf:
                        - $ref: '#/components/schemas/Report'
                        - $ref: '#/components/schemas/ModActionAppeal'
                        - $ref: '#/components/schemas/AdminResponseNotificationCardItem'
