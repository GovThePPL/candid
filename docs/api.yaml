          additionalProperties:
            type: integer
        geoLocale:
          type: object
          description: Geographic locale distribution (urban/suburban/rural)
          additionalProperties:
            type: integer
        sex:
          type: object
          description: Sex distribution
          additionalProperties:
            type: integer
        race:
          type: object
          description: Race distribution
          additionalProperties:
            type: integer
        ageRange:
          type: object
          description: Age range distribution
          additionalProperties:
            type: integer
        incomeRange:
          type: object
          description: Income range distribution
          additionalProperties:
            type: integer

    AgreedClosuresResponse:
      type: object
      description: Response containing position info, opinion groups, and agreed closures
      required:
        - position
        - groups
        - closures
      properties:
        position:
          type: object
          required:
            - id
            - statement
          properties:
            id:
              type: string
              format: uuid
            statement:
              type: string
            session:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                label:
                  type: string
            location:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                code:
                  type: string
                name:
                  type: string
            creator:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                displayName:
                  type: string
                username:
                  type: string
                userType:
                  type: string
                trustScore:
                  type: number
                  format: float
                  nullable: true
                avatarUrl:
                  type: string
                  nullable: true
                avatarIconUrl:
                  type: string
                  nullable: true
                kudosCount:
                  type: integer
        groups:
          type: array
          description: Opinion groups (same as StatsResponse.groups) for map visualization
          items:
            $ref: '#/components/schemas/OpinionGroup'
        allSessionsGroups:
          type: array
          description: Opinion groups for the location-wide (all sessions) Polis conversation
          items:
            $ref: '#/components/schemas/OpinionGroup'
        closures:
          type: array
          items:
            $ref: '#/components/schemas/AgreedClosure'

    AgreedClosure:
      type: object
      description: A single agreed closure from a chat
      required:
        - chatLogId
        - closedAt
        - positionHolderUser
        - initiatorUser
      properties:
        chatLogId:
          type: string
          format: uuid
        closureText:
          nullable: true
          description: The agreed closure proposal object
          allOf:
            - $ref: '#/components/schemas/AgreedPositionProposal'
        closedAt:
          type: string
          format: date-time
        hasAgreedStatements:
          type: boolean
          description: True if chat has more agreed statements beyond the closure
        mutualKudos:
          type: boolean
          description: True if both users sent kudos to each other
        crossGroup:
          type: boolean
          description: True if users are in different opinion groups
        positionHolderUser:
          $ref: '#/components/schemas/ClosureUserInfo'
          description: The user who held/proposed the position
        initiatorUser:
          $ref: '#/components/schemas/ClosureUserInfo'
          description: The user who initiated the chat (opposer)

    ClosureUserInfo:
      type: object
      description: User info for display in closure cards
      required:
        - id
        - displayName
        - username
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
          nullable: true
        avatarIconUrl:
          type: string
          nullable: true
        trustScore:
          type: number
          format: float
          nullable: true
        kudosCount:
          type: integer
          nullable: true
        sentKudos:
          type: boolean
          description: Whether this user sent kudos to the other participant
        opinionGroup:
          type: object
          nullable: true
          description: The user's opinion group assignment (if available)
          properties:
            id:
              type: string
            label:
              type: string
        mapPosition:
          type: object
          nullable: true
          description: The user's x,y position on the opinion map (if available)
          properties:
            x:
              type: number
            y:
              type: number
        allSessionsMapPosition:
          type: object
          nullable: true
          description: The user's x,y position on the all-sessions opinion map
          properties:
            x:
              type: number
            y:
              type: number

    ChatLogBlob:
      type: object
      description: The JSONB blob stored in the chat_log.log column (camelCase keys)
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatLogMessage'
        agreedPositions:
          type: array
          items:
            $ref: '#/components/schemas/AgreedPositionProposal'
        agreedClosure:
          $ref: '#/components/schemas/AgreedPositionProposal'
          nullable: true
        endedByUserId:
          type: string
          format: uuid
          description: ID of the user who ended the chat
        exportTime:
          type: string
          format: date-time
          description: When the chat log was exported from the chat server

    ChatLogMessage:
      type: object
      description: Individual message in a chat log blob
      required:
        - id
        - senderId
        - content
        - timestamp
      properties:
        id:
          type: string
        senderId:
          type: string
          format: uuid
        content:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum: [message, system]

    AgreedPositionProposal:
      type: object
      description: An agreed position or closure proposal in a chat
      required:
        - content
      properties:
        id:
          type: string
        proposerId:
          type: string
          format: uuid
        content:
          type: string
        status:
          type: string
          enum: [proposed, accepted, rejected]
        isClosure:
          type: boolean
          description: True if this is a closure proposal (vs an agreed position)
        timestamp:
          type: string
          format: date-time

    GetChatLogResponse:
      type: object
      description: Full chat log response with metadata
      required:
        - id
        - chatRequestId
        - startTime
        - status
      properties:
        id:
          type: string
          format: uuid
        chatRequestId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        log:
          $ref: '#/components/schemas/ChatLogBlob'
          nullable: true
        endType:
          type: string
          enum: [user_exit, agreed_closure]
          nullable: true
        status:
          type: string
          enum: [active, archived, deleted]
        position:
          $ref: '#/components/schemas/Position'
        otherUser:
          $ref: '#/components/schemas/User'
        endedByUserId:
          type: string
          format: uuid
          nullable: true
          description: ID of the user who ended the chat

    ToxicityCheckResult:
      type: object
      required:
        - isToxic
        - toxicityScore
      properties:
        isToxic:
          type: boolean
          description: Whether the text exceeds the toxicity threshold
        toxicityScore:
          type: number
          format: float
          description: Overall toxicity score (0.0-1.0)

    ErrorModel:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        details:
          type: object

    NotificationItem:
      type: object
      required:
        - id
        - type
        - title
        - body
        - isRead
        - createdTime
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [comment_reply, post_comment, chat_request, role_change, rule_change, admin_action, moderation, wiki_suggestion]
        actorUserId:
          type: string
          format: uuid
          nullable: true
        actorDisplayName:
          type: string
          nullable: true
        actorAvatarIconUrl:
          type: string
          nullable: true
        title:
          type: string
        body:
          type: string
        data:
          type: object
        isRead:
          type: boolean
        createdTime:
          type: string
          format: date-time

    DemographicCrosstab:
      type: object
      properties:
        category:
          type: string
          description: The demographic category value (e.g., "male", "liberal", "urban")
        categoryLabel:
          type: string
          description: Human-readable label for the category
        totalInCategory:
          type: integer
          description: Total respondents in this demographic category
        optionBreakdown:
          type: array
          description: Response counts for each option within this demographic
          items:
            type: object
            properties:
              optionId:
                type: string
                format: uuid
              count:
                type: integer
              percentage:
                type: number
                format: float

    WebSocketEvent:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Type of WebSocket event
        payload:
          type: object
          description: Event-specific payload

    ChatMessageEvent:
      allOf:
        - $ref: '#/components/schemas/WebSocketEvent'
        - type: object
          properties:
            type:
              enum: [message]
            payload:
              $ref: '#/components/schemas/ChatMessage'

    ChatTypingEvent:
      allOf:
        - $ref: '#/components/schemas/WebSocketEvent'
        - type: object
          properties:
            type:
              enum: [typing]
            payload:
              type: object
              required:
                - chatId
                - isTyping
              properties:
                chatId:
                  type: string
                isTyping:
                  type: boolean

    ChatStatusEvent:
      allOf:
        - $ref: '#/components/schemas/WebSocketEvent'
        - type: object
          properties:
            type:
              enum: [status]
            payload:
              type: object
              required:
                - chatId
                - status
              properties:
                chatId:
                  type: string
                status:
                  type: string
                  enum: [active, ended, user_left]

    MessageReadEvent:
      allOf:
        - $ref: '#/components/schemas/WebSocketEvent'
        - type: object
          properties:
            type:
              enum: [message_read]
            payload:
              type: object
              required:
                - chatId
                - messageIds
                - timestamp
              properties:
                chatId:
                  type: string
                messageIds:
                  type: array
                  items:
                    type: string
                  description: IDs of the messages that have been read
                agreedPositionIds:
                  type: array
                  items:
                    type: string
                  description: IDs of the agreed positions that have been read
                timestamp:
                  type: string
                  format: date-time
                  description: Time when the messages were read

    ChatRequestEvent:
      allOf:
        - $ref: '#/components/schemas/WebSocketEvent'
        - type: object
          properties:
            type:
              enum: [chat_request]
            payload:
              $ref: '#/components/schemas/ChatRequest'

    AgreedPositionEvent:
      allOf:
        - $ref: '#/components/schemas/WebSocketEvent'
        - type: object
          properties:
            type:
              enum: [agreed_position]
            payload:
              type: object
              required:
                - chatId
                - action
              properties:
                chatId:
                  type: string
                action:
                  type: string
                  enum: [propose, accept, reject, modify]
                proposalId:
                  type: string
                  description: Required when action is accept, reject, or modify
                content:
                  type: string
                  description: Required when action is propose or modify

    ChattingListItem:
      type: object
