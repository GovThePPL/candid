          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /moderation/actions:
    post:
      operationId: createModerationAction
      summary: Take inline moderation action on content (creates report + takes action in one step)
      tags:
        - Moderation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetType
                - targetId
                - ruleId
                - modResponse
              properties:
                targetType:
                  type: string
                  enum: [position, post, comment, chat_log]
                targetId:
                  type: string
                  format: uuid
                ruleId:
                  type: string
                  format: uuid
                comment:
                  type: string
                  nullable: true
                modResponse:
                  type: string
                  enum: [take_action, dismiss]
                modResponseText:
                  type: string
                actions:
                  type: array
                  items:
                    type: object
                    required:
                      - userClass
                      - action
                    properties:
                      userClass:
                        type: string
                        enum: [submitter, active_adopter, passive_adopter, reporter, reported]
                      action:
                        type: string
                        enum: [permanent_ban, temporary_ban, warning, removed]
                      duration:
                        type: integer
                        description: Duration in days for temporary bans
      responses:
        '201':
          description: Report created and action taken
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId:
                    type: string
                    format: uuid
                  modActionId:
                    type: string
                    format: uuid
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Forbidden - insufficient permissions or hierarchy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

