      responses:
        '200':
          description: Endorsement data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndorsementList'
        '404':
          description: No voting round found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    post:
      operationId: createEndorsement
      summary: Endorse a proposal
      description: Endorse a proposal in the current voting round. Max 3 endorsements per user. Only allowed during proposals_open or finalization_open.
      tags:
        - Sessions
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndorsementRequest'
      responses:
        '201':
          description: Endorsement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endorsement'
        '400':
          description: Invalid request (limit reached, wrong stage, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Voting round or proposal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '409':
          description: Already endorsed this proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /sessions/{sessionId}/endorsements/{endorsementId}:
