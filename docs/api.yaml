                      type: number
                      format: float
                      description: Relevance score (0-1)
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get session details
      tags:
        - Sessions
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      security:
        - BearerAuth: []
    patch:
      operationId: updateSession
      summary: Update a session
      description: Update session fields. Setting stage advances the session forward (must be the next stage in order). Only facilitators, moderators, or admins can update.
      tags:
        - Sessions
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: string
                  enum: [proposal_issue, proposal_qualify, proposal_stakeholders, opinion_discussion, opinion_curation, opinion_proposals, reflection, consensus]
                  description: Advance to this stage (must be the next stage in sequence)
                reason:
                  type: string
                  description: Optional reason for the stage change
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid stage transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      security:
        - BearerAuth: []

  /sessions/{sessionId}/voting-round:
    get:
      operationId: getVotingRound
      summary: Get the current voting round for a session
      tags:
        - Sessions
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: roundType
          in: query
          required: false
          schema:
            type: string
            enum: [issue_selection, policy_selection]
          description: Filter by round type. If omitted, returns the latest round.
      responses:
        '200':
          description: Current voting round
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotingRound'
        '404':
          description: No voting round found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    patch:
      operationId: advanceVotingRound
      summary: Advance voting round to next status
      description: Facilitator, moderator, or admin updates the voting round status to the next step in the sequence (proposals_open → finalization_open → proposals_closed → voting_open → voting_closed).
      tags:
        - Sessions
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated voting round
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotingRound'
        '400':
          description: Cannot advance past current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Session or voting round not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    post:
      operationId: createVotingRound
      summary: Create a new voting round for a session
      description: Creates a voting round. Only one active round per session per type. Only facilitators, moderators, or admins can create.
      tags:
        - Sessions
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVotingRoundRequest'
      responses:
        '201':
          description: Voting round created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotingRound'
        '400':
          description: Voting round already exists for this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /sessions/{sessionId}/endorsements:
    get:
      operationId: getEndorsements
      summary: Get endorsements for current user and proposal counts
      tags:
        - Sessions
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
