            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of all sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /sessions/suggestions:
    get:
      operationId: getSessionSuggestions
      summary: Suggest sessions based on a position statement
      description: Uses semantic similarity to rank sessions by relevance to the given statement
      tags:
        - Sessions
      parameters:
        - name: statement
          in: query
          required: true
          schema:
            type: string
            minLength: 10
          description: The position statement to match against sessions
        - name: limit
          in: query
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 10
      responses:
        '200':
          description: Ranked list of suggested sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    session:
                      $ref: '#/components/schemas/Session'
