          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    patch:
      operationId: patchPost
      summary: Patch a post (toggle role badge visibility)
      tags:
        - Posts
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                showCreatorRole:
                  type: boolean
                locked:
                  type: boolean
                  description: Lock or unlock the post (moderator only)
                pinnedCommentId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Comment ID to pin, or null to unpin
                pinned:
                  type: boolean
                  description: Pin or unpin this post in the feed (facilitator/moderator/admin only)
                pinSessionId:
                  type: string
                  format: uuid
                  description: Session to pin the post in (required when pinned is true)
                pinStage:
                  type: string
                  enum: [proposal_issue, proposal_qualify, proposal_stakeholders, opinion_discussion, opinion_curation, opinion_proposals, reflection, consensus]
                  description: Stage to pin the post at (required when pinned is true)
                proposalStatus:
                  type: string
                  enum: [finalized]
                  description: Set to 'finalized' to lock a draft proposal (author only, requires finalization_open voting round)
      responses:
        '200':
          description: Post patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Not author or no role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '409':
          description: Maximum pins exceeded (3 per session+stage)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

