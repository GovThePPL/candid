        creatorRole:
          type: string
          nullable: true
          description: Highest role at post location for Q&A badge display
        showCreatorRole:
          type: boolean
          nullable: true
          description: Whether creator role badge is shown on this comment (only returned for own comments)
        upvoteCount:
          type: integer
        downvoteCount:
          type: integer
        weightedUpvotes:
          type: number
          format: double
        weightedDownvotes:
          type: number
          format: double
        score:
          type: number
          format: double
        bridgingScore:
          type: number
          format: double
          nullable: true
          description: MF intercept measuring cross-ideology approval. Null until MF trains.
        childCount:
          type: integer
        userVote:
          type: object
          nullable: true
          properties:
            voteType:
              type: string
              enum: [upvote, downvote]
            downvoteReason:
