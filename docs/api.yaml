          description: Not the owner of this endorsement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Endorsement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /sessions/{sessionId}/ballot:
    get:
      operationId: getBallot
