          type: string
          nullable: true
        hasMore:
          type: boolean

    CreatePostRequest:
      type: object
      required:
        - title
        - body
        - locationId
      properties:
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 10000
        locationId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
          nullable: true
        postType:
          type: string
          enum: [discussion, question, proposal]
          default: discussion
        glossaryHighlight:
          type: boolean
          default: true
        proposalMetadata:
          type: object
          nullable: true
          description: Structured metadata from the proposal wizard (for proposal posts)

    UpdatePostRequest:
