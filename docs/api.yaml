            application/json:
              schema:
                $ref: '#/components/schemas/WikiPageDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Not authorized to create pages for these scopes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '409':
          description: A page with this title already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /wiki/pages/content:
    get:
      operationId: getWikiPage
      summary: Get full wiki page content
      description: Returns full wiki page content for reading.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
          description: Page path (e.g. "filibuster" or "guides/how-voting-works-in-oregon")
      responses:
        '200':
          description: Page detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPageDetail'
        '404':
          description: Page not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    put:
      operationId: updateWikiPage
      summary: Direct edit a wiki page
      description: Authorized users can directly edit a wiki page. Creates a version snapshot before applying changes.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
          description: Page path (e.g. "filibuster" or "guides/how-voting-works-in-oregon")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WikiPageEdit'
      responses:
        '200':
          description: Page updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPageDetail'
        '403':
          description: Not authorized to edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Page not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /wiki/pages/history:
    get:
      operationId: getWikiPageHistory
      summary: Get wiki page version history
      description: >
        Returns a list of version snapshots for a wiki page, ordered newest-first.
        Uses a query param for slug because wiki page slugs can contain slashes
        (e.g. "topics/gun-policy-in-america") which break path-based routing.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
          description: Page slug (may contain slashes for hierarchical paths)
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Version history list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionSummary'
        '404':
          description: Page not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /wiki/pages/versions/{versionId}:
    get:
      operationId: getWikiPageVersion
      summary: Get wiki page version detail with diff snapshots
      description: >
        Returns a version with before/after snapshots for client-side diffing.
        Uses a query param for slug because wiki page slugs can contain slashes.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: slug
          in: query
          required: true
          schema:
            type: string
          description: Page slug (may contain slashes for hierarchical paths)
      responses:
        '200':
          description: Version detail with snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetail'
        '404':
          description: Version or page not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /glossary/terms/{slug}/history:
    get:
      operationId: getGlossaryTermHistory
      summary: Get glossary term version history
      description: Returns a list of version snapshots for a glossary term, ordered newest-first.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version history list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionSummary'
        '404':
          description: Term not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /glossary/terms/{slug}/history/{versionId}:
    get:
      operationId: getGlossaryTermVersion
      summary: Get glossary term version detail with diff snapshots
      description: Returns a version with before/after snapshots for client-side diffing.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Version detail with snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetail'
        '404':
          description: Version or term not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /wiki/categories:
    get:
      operationId: getWikiCategories
      summary: List wiki page categories
      description: Returns distinct categories from wiki pages for filtering.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /wiki/authority:
    get:
      operationId: getWikiAuthority
      summary: Check if user can directly create wiki items
      description: Returns whether the authenticated user has authority to create terms or pages for the given scopes.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      parameters:
        - name: locationIds
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: sessionIds
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
      responses:
        '200':
          description: Authority check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAuthorityResult'

  /wiki/suggestions:
    post:
      operationId: createWikiSuggestion
      summary: Submit a wiki suggestion
      description: Submit a new term, page, or edit suggestion for review.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WikiSuggestionCreate'
      responses:
        '201':
          description: Suggestion created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiSuggestion'
        '400':
          description: Validation error
        '401':
          description: Not authenticated
        '403':
          description: Banned user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '429':
          description: Rate limit exceeded (max 5 pending per user)
    get:
      operationId: getWikiSuggestions
      summary: List wiki suggestions
      description: List suggestions filtered by view (mine, pending for review, or all within authority).
      tags:
        - Glossary
      security:
        - BearerAuth: []
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum: [mine, pending, all]
            default: mine
          description: Filter view — mine (by current user), pending (reviewable), all (within authority)
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Suggestion list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WikiSuggestion'
        '401':
          description: Not authenticated

  /wiki/suggestions/{suggestionId}:
    get:
      operationId: getWikiSuggestion
      summary: Get suggestion detail
      description: Returns full suggestion with isStale flag for conflict detection.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Suggestion detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiSuggestion'
        '401':
          description: Not authenticated
        '404':
          description: Suggestion not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    put:
      operationId: updateWikiSuggestion
      summary: Review a suggestion
      description: Approve, deny, or withdraw a suggestion. Approve applies changes and supersedes other pending suggestions for the same item.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WikiSuggestionReview'
      responses:
        '200':
          description: Suggestion updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiSuggestion'
        '400':
          description: Invalid status transition
        '401':
          description: Not authenticated
        '403':
          description: Not authorized to review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: Suggestion not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

  /wiki/suggestions/count:
    get:
      operationId: getWikiSuggestionCount
      summary: Get pending reviewable count
      description: Returns count of pending suggestions the current user can review.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pending count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiSuggestionCount'
        '401':
          description: Not authenticated

  /wiki/images:
    post:
      operationId: uploadWikiImage
      summary: Upload an image for wiki content
      description: Uploads an image file and returns its URL. Accepts png, jpg, gif, webp, svg up to 5MB.
      tags:
        - Glossary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                folder:
                  type: string
                  default: uploads
      responses:
        '201':
          description: Image uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        '400':
          description: Invalid file type or size
        '401':
          description: Not authenticated

  /wiki/images/{imageId}:
    get:
      operationId: getWikiImage
      summary: Serve a wiki image
      description: Returns the binary image data with appropriate content type.
      tags:
        - Glossary
      security: []
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Image binary data
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
