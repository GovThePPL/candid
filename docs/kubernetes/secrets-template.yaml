apiVersion: v1
kind: Secret
metadata:
  name: candid-secrets
  namespace: candid
type: Opaque
data:
  # Base64-encode values: echo -n 'value' | base64
  database-url: # postgresql://user:PASSWORD@candid-db:5432/candid
  redis-password: # Strong random password
  keycloak-backend-client-secret: # Random UUID or strong password
  keycloak-admin-password: # Strong admin password
  keycloak-db-password: # PostgreSQL password for Keycloak DB
  polis-admin-client-secret: # Random UUID or strong password
  polis-admin-password: # Strong admin password
  polis-database-url: # postgres://user:PASSWORD@polis-db:5432/polis-dev
  secret-key: # JWT signing key for pending social login tokens (openssl rand -base64 32)
  twilio-account-sid: # Twilio Account SID (optional, for SMS verification)
  twilio-auth-token: # Twilio Auth Token (optional, for SMS verification)
  twilio-phone-number: # Twilio phone number in E.164 format (e.g. +1XXXXXXXXXX)
---
apiVersion: v1
kind: Secret
metadata:
  name: candid-polis-jwt
  namespace: candid
type: Opaque
data:
  private.pem: # Base64-encoded EC private key
  public.pem: # Base64-encoded EC public key
---
# Optional: LLM API keys
apiVersion: v1
kind: Secret
metadata:
  name: candid-llm-keys
  namespace: candid
type: Opaque
data:
  anthropic-api-key: # Base64-encoded API key
  openai-api-key: # Base64-encoded API key
---
# ConfigMap: API server configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: candid-api-config
  namespace: candid
data:
  FLASK_ENV: "production"
  FLASK_APP: "app.app:create_app"
  KEYCLOAK_URL: "http://keycloak:8180"
  KEYCLOAK_ISSUER_URL: "https://auth.your-domain.com"  # Must match KC_HOSTNAME
  KEYCLOAK_REALM: "candid"
  KEYCLOAK_BACKEND_CLIENT_ID: "candid-backend"
  POLIS_API_URL: "http://polis-server:5000/api/v3"
  POLIS_BASE_URL: "http://polis-server:5000"
  POLIS_TIMEOUT: "10"
  POLIS_ADMIN_EMAIL: "polis-admin@candid.dev"
  NLP_SERVICE_URL: "http://nlp:5001"
  DB_POOL_MIN: "4"
  DB_POOL_MAX: "20"
  GUNICORN_WORKERS: "4"
  SMS_VERIFICATION_ENABLED: "true"  # Set to "false" to disable phone verification
---
# ConfigMap: Worker toggles (for candid-worker pod)
apiVersion: v1
kind: ConfigMap
metadata:
  name: candid-worker-config
  namespace: candid
data:
  POLIS_ENABLED: "true"
  MF_ENABLED: "true"
  APPROVAL_REMINDER_ENABLED: "true"
---
# ConfigMap: Chat server configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: candid-chat-config
  namespace: candid
data:
  PORT: "8002"
  KEYCLOAK_URL: "http://keycloak:8180"
  KEYCLOAK_REALM: "candid"
  NLP_SERVICE_URL: "http://nlp:5001"
---
# ConfigMap: NLP service configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: candid-nlp-config
  namespace: candid
data:
  DEVICE: "cpu"
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  MAX_BATCH_SIZE: "32"
  # LLM_PROVIDER: "anthropic"  # Uncomment to enable proposal drafting
  # LLM_MODEL: "claude-sonnet-4-20250514"
---
# ConfigMap: Keycloak configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: candid-keycloak-config
  namespace: candid
data:
  KC_DB: "postgres"
  KC_DB_URL: "jdbc:postgresql://candid-db:5432/keycloak"
  KC_DB_USERNAME: "user"
  KC_HTTP_PORT: "8180"
  KC_HOSTNAME: "auth.your-domain.com"  # Determines iss claim in tokens
  KC_HOSTNAME_PORT: "443"
  KC_FEATURES: "token-exchange:v1,admin-fine-grained-authz:v1"
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
---
# ConfigMap: Polis server configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: candid-polis-config
  namespace: candid
data:
  API_SERVER_PORT: "5000"
  MATH_ENV: "prod"
  AUTH_ISSUER: "https://auth.your-domain.com/realms/candid"  # Must match KC_HOSTNAME
  JWKS_URI: "http://keycloak:8180/realms/candid/protocol/openid-connect/certs"
  AUTH_AUDIENCE: "users"
  STATIC_FILES_HOST: "file-server"
  POLIS_JWT_AUDIENCE: "participants"
  POLIS_JWT_ISSUER: "https://pol.is/"
---
# ConfigMap: Redis configuration
# NOTE: Use a literal password value here, NOT ${REDIS_PASSWORD} —
# ConfigMaps do not perform variable substitution.
# Alternatively, generate redis.conf from a Secret using an init container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: candid-redis-config
  namespace: candid
data:
  redis.conf: |
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfsync everysec
    # WARNING: 'requirepass' must be set to a literal value here.
    # For production, consider generating this file from a Secret
    # using an init container instead.
    requirepass REPLACE_WITH_ACTUAL_PASSWORD
